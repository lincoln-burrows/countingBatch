spring:
  datasource:
    url: jdbc:mysql://localhost:3306/batchdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: batch
    password: batch1234
    driver-class-name: com.mysql.cj.jdbc.Driver
#    driver-class-name: org.h2.Driver
#    url: jdbc:h2:mem:testdb
#    username: sa
#    password:

  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console

  jpa:
    # show-sql: true
    properties:
      hibernate:
        ddl-auto: none
#        format_sql: true
        jdbc:
          batch_size: 1000
        order_inserts: true

  sql:
    init:
      mode: always

  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always

